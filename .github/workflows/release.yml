name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw 'Tag must match package.json version.' }
      - run: npm run setup
      - run: npm test
      - run: .venv/Scripts/python.exe -m unittest discover -s tests -p "test_*.py" -v
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check bundled backend
        run: '& "release/win-unpacked/resources/backend/PulsarBackend.exe" doctor'
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object Extension -in '.exe','.zip' | ForEach-Object FullName) + 'release/SHA256SUMS.txt'
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" @assets --clobber
          } else {
            gh release create "${{ github.ref_name }}" @assets --title "Pulsar Codex Deck ${{ github.ref_name }}" --generate-notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
