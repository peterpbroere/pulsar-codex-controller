name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r python/requirements.txt
      - run: npm test
      - run: node scripts/check-public-files.cjs
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Standalone backend discovery
        run: python python/adapter.py doctor
